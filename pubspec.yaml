name: jinah
description: "Jinah — 同济大学学生 AI 助手：课表与作业 TODO 汇总。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # 状态管理 / 路由
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # 本地数据库
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.6

  # 凭据安全存储 / 偏好设置
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # 工具
  intl: ^0.20.3
  dio: ^5.11.1
  webview_flutter: ^4.14.1
  file_selector: ^1.1.0

  # 截止提醒：Android 本地通知 + 桌面 toast
  flutter_local_notifications: ^22.3.3
  local_notifier: ^0.1.6

  # 定时通知的时区支持
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
